name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          tmpdir="$(mktemp -d)"
          memory-unlocked --path "$tmpdir" init
          memory-unlocked --path "$tmpdir" write \
            --tenant acme --project billing \
            --title "Refunds are async" \
            --body "Refunds are handled by a worker." \
            --source docs/refunds.md
          memory-unlocked --path "$tmpdir" recall \
            --tenant acme --project billing \
            --query refunds | grep "Refunds are async"

      - name: MCP smoke
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | MEMORY_UNLOCKED_TENANT=acme MEMORY_UNLOCKED_PROJECT=billing \
              MEMORY_UNLOCKED_HOME="$(mktemp -d)" \
              memory-unlocked-mcp \
          | tee /tmp/mcp.out
          grep '"memory_write"' /tmp/mcp.out
