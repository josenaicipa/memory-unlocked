name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run static lint
        run: python -m ruff check memory_unlocked tests scripts

      - name: Installed CLI and MCP smoke
        run: python scripts/smoke_release.py

  package:
    name: Build and inspect distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke the built wheel in a clean environment
        run: |
          python -m venv /tmp/memory-unlocked-wheel
          /tmp/memory-unlocked-wheel/bin/python -m pip install dist/*.whl
          PATH="/tmp/memory-unlocked-wheel/bin:$PATH" python scripts/smoke_release.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memory-unlocked-dist
          path: dist/*
          if-no-files-found: error
