name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Smoke the exact release wheel
        run: |
          python -m venv /tmp/memory-unlocked-release
          /tmp/memory-unlocked-release/bin/python -m pip install dist/*.whl
          PATH="/tmp/memory-unlocked-release/bin:$PATH" python scripts/smoke_release.py

      - name: Attach verified artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Publish distributions to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
