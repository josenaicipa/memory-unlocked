[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-unlocked"
version = "1.1.0"
description = "A privacy-first, scope-isolated local memory store for AI agents, with a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "memory", "privacy", "namespace", "mcp"]
authors = [{ name = "Memory Unlocked contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# Core is intentionally dependency-free.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.14,<1"]

[project.scripts]
memory-unlocked = "memory_unlocked.cli:main"
memory-unlocked-mcp = "memory_unlocked.mcp_server:main"

[project.urls]
Documentation = "https://github.com/josenaicipa/memory-unlocked/tree/main/docs"
Source = "https://github.com/josenaicipa/memory-unlocked"

[tool.setuptools]
packages = ["memory_unlocked"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
python_functions = ["test_*"]

# Keep the same default rule set as the v1.0.0 CI gate (pycodestyle subset + Pyflakes).
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
